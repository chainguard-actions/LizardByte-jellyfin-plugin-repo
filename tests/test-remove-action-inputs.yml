---
name: Test remove action input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid remove inputs (expect failure at gh-pages checkout)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: "remove"
          committer_email: "test@example.com"
          committer_name: "Test User"
          github_token: ${{ github.token }}
          release_tag: "v1.0.0"
          repository: ${{ github.repository }}
          branch: "gh-pages"

      - name: Assert action did not fail at input validation
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should pass input validation (action=remove is valid)
          # It may fail later at gh-pages checkout or push, but NOT at input validation
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: input validation passed (action=remove is valid)"
