name: Test default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Only required inputs provided; all optional inputs use defaults:
          # action: add (default)
          # branch: gh-pages (default)
          # gh_pages_url: https://lizardbyte.github.io/jellyfin-plugin-repo (default)
          # repository: LizardByte/jellyfin-plugin-repo (default)
          # release_tag: latest (default)
          committer_email: test@example.com
          committer_name: Test User
          github_token: ${{ github.token }}
      - name: Assert action ran with defaults (setup inputs passed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with default inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo — git/checkout ops cannot succeed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
