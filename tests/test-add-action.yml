name: Test add action setup inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: add
          committer_email: test@example.com
          committer_name: Test User
          github_token: ${{ github.token }}
          release_tag: v1.0.0
          repository: LizardByte/jellyfin-plugin-repo
          branch: gh-pages
          gh_pages_url: https://lizardbyte.github.io/jellyfin-plugin-repo
      - name: Assert action ran (setup inputs passed or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo — git/checkout ops cannot succeed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
