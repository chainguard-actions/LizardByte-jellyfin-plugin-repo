name: Test add action default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with add (default) action input
        id: action
        uses: .
        continue-on-error: true
        with:
          action: add
          committer_email: test@example.com
          committer_name: Test User
          github_token: fake-token
          repository: LizardByte/jellyfin-plugin-repo
          release_tag: v1.0.0
          plugin_url: https://example.com/plugin.zip
          zipfile: /tmp/plugin.zip

      - name: Assert action did not fail at input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at checkout (no real token), not at input validation.
          # If it failed at input validation, it would also be 'failure', but the
          # important thing is that 'add' is a valid action value.
          # We verify it's not 'success' (since we have no real token) but also
          # that the inputs step itself accepted 'add' as valid.
          if [ "$OUTCOME" == "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" == "failure" ]; then
            echo "PASS: action failed at a later step (not at input validation), as expected with fake credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
