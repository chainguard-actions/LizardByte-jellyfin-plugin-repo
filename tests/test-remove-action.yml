name: Test remove action input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action will fail at the "Checkout gh-pages" step because it tries
      # to checkout a branch from an external repo with push credentials.
      # We use continue-on-error to capture what we can and verify the
      # inputs setup logic ran correctly (action doesn't fail at step 1).
      - name: Run action with remove input
        id: action
        uses: .
        continue-on-error: true
        with:
          action: "remove"
          committer_email: "test@example.com"
          committer_name: "Test User"
          github_token: ${{ github.token }}
          release_tag: "v2.3.4"
          plugin_url: "https://example.com/plugin.zip"
          zipfile: ""

      - name: Assert action did not fail at inputs validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # "remove" is a valid action value, so the inputs step should not reject it
          # The action may fail at later steps (checkout/push) but not at validation
          echo "PASS: action accepted 'remove' as a valid action value (outcome=$OUTCOME)"

      - name: Verify release_version output strips v prefix for remove
        env:
          RELEASE_VERSION: ${{ steps.action.outputs.release_version }}
        run: |
          echo "release_version: $RELEASE_VERSION"
          if [ -n "$RELEASE_VERSION" ]; then
            if [ "$RELEASE_VERSION" != "2.3.4" ]; then
              echo "FAIL: expected release_version '2.3.4' but got '$RELEASE_VERSION'"
              exit 1
            fi
            echo "PASS: release_version correctly strips 'v' prefix for remove action"
          else
            echo "INFO: release_version output not available (action may have failed at a later step)"
            echo "PASS: skipping output assertion"
          fi
