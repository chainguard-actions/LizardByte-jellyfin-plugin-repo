name: Test add action input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with action=add and valid required inputs.
      # The action will fail at the checkout gh-pages step (can't access real repo),
      # but the Setup inputs step should succeed and produce correct outputs.
      - name: Run action with add input
        id: action
        uses: .
        continue-on-error: true
        with:
          action: "add"
          committer_email: "test@example.com"
          committer_name: "Test User"
          github_token: "fake-token"
          release_tag: "v1.2.3"
          repository: "LizardByte/jellyfin-plugin-repo"
          gh_pages_url: "https://lizardbyte.github.io/jellyfin-plugin-repo"
          branch: "gh-pages"

      # The action should fail (at checkout or push step), but NOT at the inputs step.
      # A failure at the inputs step would mean invalid action value was rejected.
      # Since action=add is valid, the action should proceed past inputs validation.
      - name: Assert action did not fail at input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail (can't push to real gh-pages),
          # but it must NOT fail with "Invalid action" error (that would be exit 1 at inputs step).
          # We verify the outcome is 'failure' (expected due to env constraints) not 'success'
          # which would be unexpected, and not a lint error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with add input (outcome=$OUTCOME, input validation passed)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
