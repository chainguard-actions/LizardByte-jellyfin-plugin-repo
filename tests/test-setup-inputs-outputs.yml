---
name: Test setup inputs outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with add action (expect failure at publish step)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: "add"
          committer_email: "test@example.com"
          committer_name: "Test User"
          github_token: ${{ github.token }}
          release_tag: "v1.2.3"
          repository: "LizardByte/jellyfin-plugin-repo"
          branch: "gh-pages"
          gh_pages_url: "https://lizardbyte.github.io/jellyfin-plugin-repo"

      - name: Assert action ran (may fail at publish step, that is acceptable)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail at the publish step due to permissions,
          # but the setup inputs step should have run successfully.
          # We just verify the action was invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
