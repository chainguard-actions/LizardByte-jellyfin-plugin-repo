name: Test invalid action input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid action value (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: "invalid"
          committer_email: "test@example.com"
          committer_name: "Test User"
          github_token: "fake-token"

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid action input, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid action input"
