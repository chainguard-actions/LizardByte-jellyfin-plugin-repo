name: Test add action (input validation and setup)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: add
          committer_email: "test@example.com"
          committer_name: "Test User"
          github_token: ${{ github.token }}
          release_tag: "v1.0.0"
          repository: "LizardByte/jellyfin-plugin-repo"
          branch: "gh-pages"
          gh_pages_url: "https://lizardbyte.github.io/jellyfin-plugin-repo"

      - name: Assert action ran (passed input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail at a later step (checkout/push)
          # but NOT fail at the input validation step (which would indicate a bug
          # in the 'add' action value handling).
          # A failure here is expected due to the sentinel GITHUB_REPOSITORY
          # or network access to external repos.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
