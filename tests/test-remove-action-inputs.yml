name: Test remove action input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/tags/v1.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with remove action value
        id: action
        uses: .
        continue-on-error: true
        with:
          action: "remove"
          committer_email: "test@example.com"
          committer_name: "Test User"
          github_token: "fake-token"
          release_tag: "v1.0.0"
          repository: "LizardByte/jellyfin-plugin-repo"
          gh_pages_url: "https://lizardbyte.github.io/jellyfin-plugin-repo"
          branch: "gh-pages"

      - name: Assert action did not fail at input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail at the checkout step (external repo access),
          # but it should NOT fail at the input validation step with "Invalid action".
          # We verify the action ran (outcome is not 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: $OUTCOME) - 'remove' input validation passed"
