name: Test remove action input validation
on:
  workflow_dispatch:
jobs:
  test-remove-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid remove action value
        id: action
        uses: .
        continue-on-error: true
        with:
          action: remove
          committer_email: test@example.com
          committer_name: Test User
          github_token: fake-token
          release_tag: v1.0.0
          repository: LizardByte/jellyfin-plugin-repo

      - name: Assert action did not fail on input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should pass input validation (action=remove is valid)
          # It may fail later at network steps (checkout, push), but should NOT
          # fail at the Setup inputs step with "Invalid action" error.
          if [ "$OUTCOME" == "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with valid 'remove' input (outcome=$OUTCOME)"
